<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1280" height="720" fill="#13161E"/>
  <rect x="0" y="0" width="1280" height="6" fill="#5BE3A7"/>

  <text x="80" y="92" fill="#5BE3A7" font-size="20" font-weight="bold" letter-spacing="2">AUTOMATED IN-GAME BENCHMARK · MINECRAFT 1.21 – 26.2</text>
  <text x="80" y="150" fill="#FFFFFF" font-size="48" font-weight="bold">How much tooltip work Sodium Relief skips</text>
  <text x="80" y="188" fill="#9BA3B4" font-size="22">It builds each item's tooltip once and reuses the layout, instead of rebuilding it every frame.</text>

  <!-- Panel 1: static hover -->
  <text x="80" y="262" fill="#FFFFFF" font-size="26" font-weight="bold">Resting on an item</text>
  <text x="80" y="292" fill="#9BA3B4" font-size="19">Cursor held on one item, 2,429 frames</text>

  <rect x="80" y="314" width="820" height="30" rx="4" fill="#3A3F4B"/>
  <text x="90" y="335" fill="#C7CCD6" font-size="17">Vanilla rebuilds every frame · 2,429 builds</text>
  <rect x="80" y="354" width="6" height="30" rx="3" fill="#5BE3A7"/>
  <text x="98" y="375" fill="#5BE3A7" font-size="17" font-weight="bold">With Sodium Relief · 2 builds</text>

  <text x="1200" y="346" fill="#5BE3A7" font-size="56" font-weight="bold" text-anchor="end">99.9%</text>
  <text x="1200" y="378" fill="#9BA3B4" font-size="19" text-anchor="end">builds avoided</text>

  <line x1="80" y1="420" x2="1200" y2="420" stroke="#262B36" stroke-width="2"/>

  <!-- Panel 2: inventory scan -->
  <text x="80" y="474" fill="#FFFFFF" font-size="26" font-weight="bold">Scanning the inventory</text>
  <text x="80" y="504" fill="#9BA3B4" font-size="19">Cursor sweeping 36 stacked items, 3 passes</text>

  <rect x="80" y="526" width="820" height="30" rx="4" fill="#3A3F4B"/>
  <text x="90" y="547" fill="#C7CCD6" font-size="17">Vanilla rebuilds every frame · 3,714 builds</text>
  <rect x="80" y="566" width="10" height="30" rx="3" fill="#5BE3A7"/>
  <text x="100" y="587" fill="#5BE3A7" font-size="17" font-weight="bold">With Sodium Relief · 38 builds (each item built once, reused across passes)</text>

  <text x="1200" y="558" fill="#5BE3A7" font-size="56" font-weight="bold" text-anchor="end">~99%</text>
  <text x="1200" y="590" fill="#9BA3B4" font-size="19" text-anchor="end">builds avoided</text>

  <text x="80" y="652" fill="#C7CCD6" font-size="19">Each tooltip build measured at <tspan fill="#5BE3A7" font-weight="bold">~0.1–0.3 ms</tspan> · layout reuse saved <tspan fill="#5BE3A7" font-weight="bold">~0.5 s</tspan> of CPU over the inventory test.</text>
  <text x="80" y="686" fill="#6B7280" font-size="16">Reproducible via gradlew runClientGameTest · counts real getTooltipFromItem builds (measured time, not FPS) · near-identical across 1.21 – 26.2</text>
</svg>
