# --- Minecraft 26.1.x ---
# MC 26.1+ is fully unobfuscated and runs on Java 25; the 26.1.x subproject uses the
# non-remap `net.fabricmc.fabric-loom` plugin with no mapping layer. Set
# include_mc261x=false to skip it (e.g. when no JDK 25 is installed).
include_mc261x=true
minecraft_261x=26.1.2
fabric_loader_261x=0.19.2
fabric_api_261x=0.149.1+26.1.2
modmenu_261x=18.0.0-alpha.8
loom_version=1.16.2
# Sodium has no 26.1.x publication yet, so the native Sodium config-sidebar integration
# is not built for 26.x; config is exposed via Mod Menu (and a vanilla options button).

gson_version=2.13.1
