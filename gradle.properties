org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain JDKs. Auto-detect off so the build doesn't surprise-pick a wrong vendor;
# explicit paths matter on Windows where Gradle's scan doesn't always find every JDK.
# Replace these paths if your JDK install locations differ.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.10+7,C:\\Program Files\\Amazon Corretto\\jdk25.0.3_9

mod_id=sodiumrelief
mod_version=1.2.0
maven_group=com.erodev

