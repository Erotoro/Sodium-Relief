org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain JDKs. Auto-detect off so the build doesn't surprise-pick a wrong vendor;
# explicit paths matter on Windows where Gradle's scan doesn't always find every JDK.
# Replace these paths if your JDK install locations differ.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.10+7,C:\\Program Files\\Amazon Corretto\\jdk25.0.3_9

mod_id=sodiumrelief
mod_version=1.3.0
maven_group=com.erodev

# --- Minecraft 1.21.11 ---
minecraft_12111=1.21.11
yarn_mappings_12111=1.21.11+build.1
fabric_loader_12111=0.18.2
fabric_api_12111=0.139.4+1.21.11
modmenu_12111=17.0.0
sodium_12111=mc1.21.11-0.8.6-fabric
loom_remap_version=1.14-SNAPSHOT

# --- Minecraft 26.1.x ---
# MC 26.1+ is fully unobfuscated and runs on Java 25; the 26.1.x subproject uses the
# non-remap `net.fabricmc.fabric-loom` plugin with no mapping layer. Set
# include_mc261x=false to skip it (e.g. when no JDK 25 is installed).
include_mc261x=true
minecraft_261x=26.1.2
fabric_loader_261x=0.19.2
fabric_api_261x=0.149.1+26.1.2
modmenu_261x=18.0.0-alpha.8
loom_version=1.16.2
# Sodium has no 26.1.x publication yet, so the native Sodium config-sidebar integration
# is not built for 26.x; config is exposed via Mod Menu (and a vanilla options button).

# --- Minecraft 26.2 ---
# Same platform shape as 26.1.x (fully unobfuscated, Java 25, non-remap Loom). Shares
# loom_version above. Set include_mc262x=false to skip it (e.g. when no JDK 25 is
# installed). Sodium still has no 26.x publication, so no native Sodium integration here.
include_mc262x=true
minecraft_262x=26.2
fabric_loader_262x=0.19.3
fabric_api_262x=0.153.0+26.2
modmenu_262x=20.0.0-beta.4

# --- Minecraft 1.21 – 1.21.10 (legacy obfuscated line) ---
# Same platform shape as 1.21.11 (obfuscated/Yarn, `fabric-loom-remap`, Java 21). To keep
# this maintainable, the 11 versions are covered by a few range-jars rather than one module
# each: every module below is BUILT against the newest version in its group and declares the
# broader Minecraft range in its fabric.mod.json. Native Sodium options-page integration is
# NOT built here (older Sodium config APIs differ); config is via Mod Menu + the vanilla
# options button, exactly like the 26.x modules. Each is gated behind include_<module>
# (default true) so contributors can opt out with e.g. `-Pinclude_mc1211=false`. The Fabric
# loader is MC-agnostic, so all reuse fabric_loader_12111 above.

# mc1211 — covers 1.21 and 1.21.1
