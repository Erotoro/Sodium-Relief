plugins {
    id "com.modrinth.minotaur" version "2.+"
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base {
    archivesName = "${mod_id}-mc262x"
}

// MC 26.x ships on Java 25.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

loom {
    mods {
        sodiumrelief {
            sourceSet sourceSets.main
        }
    }
}

// Client gametest: drives a real 26.2 client into an inventory screen and exports
// a benchmark snapshot, mirroring the other modules. Runs via
// `gradlew :sodium-relief-mc262x:runClientGameTest` (needs JDK 25).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sodiumrelief-gametest"
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_262x}"
    // MC 26.1+ ships fully unobfuscated with official names and parameter names,
    // so no mapping layer is used. The `net.fabricmc.fabric-loom` plugin (not the
    // `-remap` variant) skips all remapping; declaring any `mappings` here fails with
    // "Cannot use Mojang mappings in a non-obfuscated environment". Source therefore
    // references Minecraft by its official names directly.
    // The non-remap Loom plugin does not provide the mod* configurations (they exist
    // only to remap mod dependencies between intermediary and dev mappings). With no
    // remapping, mod dependencies are consumed as-is via the standard Gradle configs.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_262x}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_262x}"

    // Shared, pure-Java logic packaged into the final jar.
    implementation project(":sodium-relief-core")

    compileOnly "com.terraformersmc:modmenu:${modmenu_262x}"
    runtimeOnly "com.terraformersmc:modmenu:${modmenu_262x}"

    // No Sodium publication confirmed for 26.x. Add once available:
    // compileOnly "maven.modrinth:sodium:${sodium_262x}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from(project(":sodium-relief-core").sourceSets.main.output)

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

sourcesJar {
    from(project(":sodium-relief-core").sourceSets.main.allSource)
}

// Publish to Modrinth via Minotaur. Dry run by default (debugMode); pass -PmodrinthRelease
// to actually upload. Token comes from the MODRINTH_TOKEN env var; project id is fixed below.
modrinth {
    debugMode = !project.hasProperty("modrinthRelease")
    projectId = "sodium-relief"
    versionNumber = "${project.version}+26.2"
    versionName = "Sodium Relief ${project.version} for MC 26.2"
    versionType = project.findProperty("modrinthVersionType") ?: "release"
    uploadFile = tasks.jar // non-remap Loom (26.x is unobfuscated): no remapJar
    gameVersions = ["26.2"]
    loaders = ["fabric"]
    changelog = providers.environmentVariable("CHANGELOG").getOrElse("")
    dependencies {
        required.project "fabric-api"
        optional.project "modmenu"
        optional.project "sodium"
    }
}
